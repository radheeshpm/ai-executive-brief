
name: Daily AI Executive Brief

on:
  workflow_dispatch:

  schedule:
    # Every day at 7:15 AM India time
    - cron: '15 7 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and Publish AI Brief
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Generate AI briefing with retries
      - name: Generate verified briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          echo "Starting Daily AI Executive Brief"
          echo "Gemini model: $GEMINI_MODEL"

          for attempt in 1 2 3 4; do

            echo "--------------------------------"
            echo "Generation attempt: $attempt of 4"
            echo "--------------------------------"

            if python generate_brief.py; then
              echo "SUCCESS: Briefing generated"
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: All attempts failed"
              exit 1
            fi

            echo "Waiting 60 seconds before retry"
            sleep 60

          done

      # Step 5: Commit generated RSS
      - name: Commit RSS update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          if git diff --cached --quiet; then
            echo "No new RSS content to publish"
          else
            git commit -m "Publish daily AI executive briefing"
            git push
            echo "RSS successfully published"
          fi

      # Step 6: Final status
      - name: Complete
        run: |
          echo "Daily AI Executive Brief workflow completed"
          echo "RSS feed:"
          echo "https://radheeshpm.github.io/ai-executive-brief/rss.xml"
