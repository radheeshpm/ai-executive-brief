name: Daily AI Executive Brief

on:
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: 'Build website from existing RSS without calling Gemini'
        type: boolean
        required: false
        default: false
  schedule:
    # 01:45 UTC = 07:15 India Standard Time (UTC+05:30)
    - cron: '45 1 * * *'

permissions:
  contents: write

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing and website
        if: ${{ inputs.rebuild_only != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4; do
            if python generate_brief.py; then
              echo 'Briefing and website generated successfully'
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'All generation attempts failed'
              exit 1
            fi
            echo 'Generation failed; waiting 60 seconds before retry'
            sleep 60
          done

      - name: Rebuild website from existing RSS
        if: ${{ inputs.rebuild_only == true }}
        run: python generate_brief.py --rebuild-pages

      - name: Commit RSS and website updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rss.xml index.html briefs/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish AI executive briefing and website'
            git push
          else
            echo 'No changes to publish'
          fi
